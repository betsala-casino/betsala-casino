<!DOCTYPE html>
<html lang="es-CL">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso seguro a BetSala</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

</head>
<body>
<div class="redirect-page">
  <div>
    <div class="spinner"></div>
    <h1>Conectando con <span style="color:var(--accent-soft)">BetSala</span></h1>
    <p>Se abrirá la ruta externa para continuar con registro, login, casino o apuestas.</p>
    <p>Si el cambio no ocurre de inmediato, utiliza el enlace manual.</p>
    <div class="manual">Abrir manualmente: <a id="manual-link" href="#" rel="nofollow noopener noreferrer sponsored">continuar a BetSala</a>.</div>
  </div>
</div>
<script>
(function () {
  var REFERRAL_URL = 'https://betsala11.com/affiliates/?btag=62572_l384932';
  try {
    var currentParams = new URLSearchParams(window.location.search);
    var passThrough = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','sub','sub_id','clickid','gclid'];
    var url = new URL(REFERRAL_URL);
    passThrough.forEach(function (k) {
      if (currentParams.has(k) && !url.searchParams.has(k)) url.searchParams.set(k, currentParams.get(k));
    });
    REFERRAL_URL = url.toString();
  } catch (e) { }
  document.getElementById('manual-link').setAttribute('href', REFERRAL_URL);
  setTimeout(function () { window.location.replace(REFERRAL_URL); }, 1500);
})();
</script>
